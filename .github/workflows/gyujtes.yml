name: Lehetőségek gyűjtése

on:
  schedule:
    - cron: "0 4 * * *"   # minden nap 04:00 UTC (magyar idő szerint 5 vagy 6 óra)
  workflow_dispatch:       # kézi indítás az Actions fülön
    inputs:
      kenyszerit:
        description: "Változatlan oldalakat is dolgozza fel"
        type: boolean
        default: false

permissions:
  contents: write          # hogy vissza tudja menteni az adatfájlokat

concurrency:
  group: gyujtes
  cancel-in-progress: false

jobs:
  gyujtes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Csomagok telepítése
        run: pip install -r requirements.txt

      - name: Gyűjtés
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_JOVAHAGYAS: ${{ vars.AUTO_JOVAHAGYAS || '0' }}
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
        run: python gyujto.py ${{ inputs.kenyszerit && '--kenyszerit' || '' }}

      - name: Változások mentése
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adatok.json archivum.json allapot.json
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "Adatfrissítés $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
